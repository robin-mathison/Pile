{% extends "layout.html" %}

{% block content %}
<div id="display-page" class="container-fluid text-center">
    <p><h2 align="center">We're so on</h2></p>
    
    <!-- Video element to display the webcam feed -->
    <div class="mt-3">
        <video id="webcam" autoplay playsinline width="640" height="480" style="border: 2px solid #333; border-radius: 8px; background: #000;"></video>
    </div>
</div>

<script>
    document.addEventListener("DOMContentLoaded", () => {
        const video = document.getElementById('webcam');

        // Request access to the USB / default video camera
        navigator.mediaDevices.getUserMedia({ video: true, audio: false })
            .then((stream) => {
                video.srcObject = stream;
            })
            .catch((err) => {
                console.error("Error accessing webcam: ", err);
                alert("Could not access camera. Make sure permissions are allowed and HTTPS or localhost is used.");
            });
    });
</script>
{% endblock content %}
